<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 90" width="260" height="90">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f7fe"/>
      <stop offset="100%" stop-color="#deeafb"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3D9"/>
      <stop offset="100%" stop-color="#1B6CA8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9C74F"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B6CA8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background pill -->
  <rect x="0" y="0" width="260" height="90" rx="20" fill="url(#skyGrad)"/>

  <!-- sun rays -->
  <g transform="translate(38,44)">
    <line x1="0" y1="-22" x2="0" y2="-17" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="17" x2="0" y2="22" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="-22" y1="0" x2="-17" y2="0" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="17" y1="0" x2="22" y2="0" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="-16" y1="-16" x2="-12" y2="-12" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="12" y1="12" x2="16" y2="16" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="16" y1="-16" x2="12" y2="-12" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="-12" y1="12" x2="-16" y2="16" stroke="#F9C74F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="0" cy="0" r="11" fill="url(#sunGrad)"/>
  </g>

  <!-- cloud (from uploaded SVG) -->
  <g transform="translate(4, 30) scale(0.16)" filter="url(#softShadow)">
    <path fill="url(#cloudGrad)" stroke="#c5d9f5" stroke-miterlimit="10" stroke-width="6"
      d="m291 107-2.5.1A83.9 83.9 0 00135.6 43 56 56 0 0051 91a56.6 56.6 0 00.8 9A60 60 0 0063 219l4-.2v.2h224a56 56 0 000-112Z"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="-10 0; 10 0; -10 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="158" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700"
    fill="#ffffff" letter-spacing="3" text-anchor="middle" opacity="0.97">WEATHER</text>
</svg>
